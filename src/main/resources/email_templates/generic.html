<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{subject}}</title>
  <style>
    body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background:#f4f6f8; color:#111827; margin:0; padding:20px; }
    .container { max-width:600px; margin:24px auto; background:#fff; border-radius:8px; box-shadow:0 1px 3px rgba(16,24,40,0.05); overflow:hidden; }
    .header { background:#0f172a; color:#fff; padding:20px 24px; }
    .brand { font-weight:700; font-size:18px; }
    .content { padding:24px; }
    .message { font-size:15px; line-height:1.6; }
    .footer { padding:16px 24px; background:#f8fafc; color:#6b7280; font-size:13px; }
    a.button { display:inline-block; background:#10b981; color:#fff; padding:10px 16px; border-radius:6px; text-decoration:none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">SIPESA – SMP POMOSDA</div>
    </div>
    <div class="content">
      <p>Halo {{name}},</p>
      <div class="message">{{message}}</div>
      <p style="margin-top:18px;">Salam,<br/>Tim SIPESA</p>
    </div>
    <div class="footer">
      <div>SIPESA • SMP POMOSDA</div>
    </div>
  </div>
</body>
</html>
