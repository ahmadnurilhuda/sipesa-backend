spring:
  application:
    name: sipesa-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sipesa}
    username: ${SPRING_DATASOURCE_USERNAME:sipesa}
    password: ${SPRING_DATASOURCE_PASSWORD:sipesa}
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:01b6070ddf6ea8}
    password: ${MAIL_PASSWORD:86fe3cca97f71d86fe3cca97f71d}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-at-least-32-characters-long}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  notification:
    channel: EMAIL
    email:
      enabled: ${MAIL_ENABLED:false}
      from: ${MAIL_FROM:no-reply@sipesa.local}
      subject-prefix: "[SIPESA] "
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    provider: baileys-gateway
    gateway-url: ${WHATSAPP_GATEWAY_URL:http://localhost:3010}
    gateway-api-key: ${WHATSAPP_GATEWAY_API_KEY:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
