spring:
  application:
    name: sipesa-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
mailtrap:
  api:
    token: ${MAILTRAP_API_TOKEN}
    inbox-id: ${MAILTRAP_INBOX_ID}
#  mail:
#    host: ${MAIL_HOST:localhost}
#    port: ${MAIL_PORT:587}
#    username: ${MAIL_USERNAME:}
#    password: ${MAIL_PASSWORD:}
#    properties:
#      mail:
#        smtp:
#          auth: true
#          starttls:
#            enable: true
#          ssl:
#            enable: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0
  forward-headers-strategy: framework
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  notification:
    channel: ${NOTIFICATION_CHANNEL:EMAIL}
    email:
      enabled: ${MAIL_ENABLED:true}
      from: ${MAIL_FROM:no-reply@sipesa.local}
      subject-prefix: "${MAIL_SUBJECT_PREFIX:[SIPESA] }"
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    provider: ${WHATSAPP_PROVIDER:baileys-gateway}
    gateway-url: ${WHATSAPP_GATEWAY_URL:http://localhost:3010}
    gateway-api-key: ${WHATSAPP_GATEWAY_API_KEY:}
  permission:
    return-reminder-interval-ms: ${RETURN_REMINDER_INTERVAL_MS:300000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
